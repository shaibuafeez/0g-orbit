name: Feature Request
description: Suggest a new feature for 0G Orbit
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Include API examples if applicable.
      placeholder: |
        ```typescript
        // Example of desired API
        const result = await orbit.newFeature({ ... })
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Storage
        - Inference
        - Fine-Tuning
        - CLI
        - SDK Core
        - Other
    validations:
      required: true
