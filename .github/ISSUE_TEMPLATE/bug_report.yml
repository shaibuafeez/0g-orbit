name: Bug Report
description: Report a bug in 0G Orbit
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps to reproduce the issue
      placeholder: |
        ```typescript
        import { Orbit } from '0g-orbit'
        const orbit = new Orbit({ ... })
        // ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "0g-orbit version (run: npm ls 0g-orbit)"
      placeholder: "0.2.2"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - testnet
        - mainnet
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "v20.12.0"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 15, Ubuntu 22.04, etc."
